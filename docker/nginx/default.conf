server {
    listen 80;
    server_name localhost;

    root /var/www/html/public;
    index index.php;

    # No revelar la versión de nginx en la cabecera Server (information disclosure).
    server_tokens off;

    # Cabeceras de seguridad ("always": también en las respuestas de error).
    # - nosniff: el navegador respeta el Content-Type (un CSS que en realidad es HTML no se aplica).
    # - X-Frame-Options y frame-ancestors: nadie puede enmarcar la aplicación (clickjacking).
    # - Referrer-Policy same-origin: el Referer solo se envía dentro del propio sitio (lo usa
    #   reject_foreign_origin() como alternativa a Origin).
    # - CSP: solo se ejecuta JavaScript propio o de la CDN, y no hay scripts ni estilos en línea.
    #   Por eso el botón Eliminar usa data-confirm + js/confirm-submit.js y no un onsubmit en línea.
    #   Si se añade otra CDN, otro script o un <style> en línea, hay que reflejarlo aquí.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' https://cdn.jsdelivr.net; font-src https://cdn.jsdelivr.net; img-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;

    # Todo lo que no sea un archivo existente va al front controller
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Los .php se envían a PHP-FPM (servicio "php", puerto 9000)
    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Bloquea archivos ocultos (.env, .git, .htaccess...)
    location ~ /\. {
        deny all;
    }
}
